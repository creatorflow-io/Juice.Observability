name: Alpha NuGet

# Push to a release/* branch that changes the backend: test packages of Juice.Observability.* at
# <VersionPrefix>-alpha.<run number> (VersionPrefix in Directory.Build.props on that branch) → GitHub Packages
# (nuget.pkg.github.com/creatorflow-io). Beta and stable packages come only from an api-* release tag (release.yml).
on:
  push:
    branches: [ 'release/**' ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'nuget.config'
      - '!**.md'
  workflow_dispatch:

jobs:
  nuget:
    uses: creatorflow-io/shared-workflows/.github/workflows/shared-pack.yml@net8
    with:
       Stage: alpha
       Target: |
          10.0.x
    secrets: inherit
