# The scale stack (docs/phase-10-plan.md P3, P8): the local stack under its own compose project (juice-scale: own volumes and network),
# with the scale rules, SLOs and a webhook sink. Used through scale/stack.sh, never on its own:
#   docker compose -p juice-scale -f docker-compose.yml -f scale/compose.scale.yml --profile platform ...
# It uses the same host ports as the working stack, so only one of the two runs at a time.
services:
  platform-api:
    environment:
      # The sink's signing secret (scale/notifications-provisioning.json: env:JUICE_WEBHOOK_SCALE). A scratch value: the sink doesn't check it.
      JUICE_WEBHOOK_SCALE: scale-sink-signing-secret
      # The sink is http on a private address: the pipeline sends over http to what the allowlist lists only when told to.
      Notifications__Delivery__AllowHttpToAllowlisted: "true"
    volumes:
      - ./scale/rules.json:/config/rules.json:ro
      - ./scale/notifications-provisioning.json:/config/notifications-provisioning.json:ro
      - ./scale/slos.json:/config/slos.json:ro
    depends_on:
      webhook-sink:
        condition: service_healthy

  # Answers every webhook with 200, as a healthy receiver would; when it was sent is in the pipeline's notifications.deliveries.
  webhook-sink:
    profiles: ["platform"]
    image: node:24.11.1-alpine3.22
    command: ["node", "-e", "require('http').createServer((q,r)=>{q.resume();q.on('end',()=>r.end('ok'))}).listen(8080)"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15

# Pinned so scale/notifications-provisioning.json can allowlist the sink's address.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.240.0/24
