# Juice Observability — local single-tenant stack (roadmap Phase 1, Track A). Run scripts/init.sh once first.
#
#   OTLP (TLS + bearer token)  localhost:4317 gRPC, localhost:4318 HTTP
#   Grafana (optional)         http://localhost:3000  (--profile grafana; sign in with Keycloak; demo users in README.md)
#   Keycloak                   http://localhost:8080  (shared: ../../../dev-infra, started first; realm juice, SSO with the other Juice apps)
#   ClickHouse HTTP            http://localhost:8123  (bound to 127.0.0.1)
#   PostgreSQL                 localhost:5433         (platform domain database, used by Track B)
#
# Images are pinned; change versions here and in README.md together.

# ClickHouse's image and what clickhouse/init-users.sh needs, shared by the server and the clickhouse-access service.
x-clickhouse-image: &clickhouse-image clickhouse/clickhouse-server:26.8.36.3-alpine
x-clickhouse-access-env: &clickhouse-access-env
  CLICKHOUSE_USER: admin
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?run scripts/init.sh}
  CLICKHOUSE_OTEL_PASSWORD: ${CLICKHOUSE_OTEL_PASSWORD}
  CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
  CLICKHOUSE_PLATFORM_PASSWORD: ${CLICKHOUSE_PLATFORM_PASSWORD}
  # The platform's ClickHouse sampler (Phase 11 R5): a few system tables, nothing in otel.
  CLICKHOUSE_MONITOR_PASSWORD: ${CLICKHOUSE_MONITOR_PASSWORD:?run scripts/init.sh}
  # Grafana's row policy (clickhouse/init-users.sh): grafana_reader sees only this tenant.
  JUICE_PLATFORM_TENANT_ID: ${JUICE_PLATFORM_TENANT_ID:?run scripts/init.sh}

services:
  clickhouse:
    image: *clickhouse-image
    environment:
      <<: *clickhouse-access-env
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init-users.sh:/docker-entrypoint-initdb.d/init-users.sh:ro
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./clickhouse/access.xml:/etc/clickhouse-server/config.d/access.xml:ro
      - ./backups/clickhouse:/backups
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      JUICE_PLATFORM_TENANT_ID: ${JUICE_PLATFORM_TENANT_ID:?run scripts/init.sh}
      CLICKHOUSE_OTEL_PASSWORD: ${CLICKHOUSE_OTEL_PASSWORD}
      JUICE_TRACES_TTL: ${JUICE_TRACES_TTL}
      JUICE_METRICS_TTL: ${JUICE_METRICS_TTL}
      JUICE_LOGS_TTL: ${JUICE_LOGS_TTL}
      # host.name for host_metrics (read by the env detector); otherwise it would be the container id.
      OTEL_RESOURCE_ATTRIBUTES: host.name=${JUICE_HOST_NAME:-local-docker-host}
      # Names this Collector in its own metrics (the platform pipeline, collector/config.yaml).
      JUICE_COLLECTOR_INSTANCE: otel-collector
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./secrets/tls/server.crt:/etc/otelcol/tls/server.crt:ro
      - ./secrets/tls/server.key:/etc/otelcol/tls/server.key:ro
      - ./secrets/otlp-tokens:/etc/otelcol/secrets/otlp-tokens:ro
      - ./secrets/platform-otlp-token:/etc/otelcol/secrets/platform-otlp-token:ro
      - /:/hostfs:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:4319:4319"     # the platform's own metrics (its own token; loopback only, for tests/verify.sh)
      - "127.0.0.1:8888:8888"     # Collector's own metrics (queue size, refused, dropped)
      - "127.0.0.1:13133:13133"   # health check
    depends_on:
      clickhouse:
        condition: service_healthy
      # Its password applied (a password rotated in .env reaches ClickHouse through clickhouse/init-users.sh).
      clickhouse-access:
        condition: service_healthy

  # Only with --profile test: the same Collector stamping its own tenant, for the integration tests. Their services,
  # alerts and scratch data stay out of the tenant the running API works on.
  otel-collector-test:
    extends: { service: otel-collector }
    profiles: [test]
    environment:
      JUICE_PLATFORM_TENANT_ID: 0193f0aa-0000-7000-8000-0000000000f1   # the integration tests' tenant Id (it was local-test)
      JUICE_COLLECTOR_INSTANCE: otel-collector-test
    ports: !override
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18888:8888"    # its own metrics, read by tests/verify.sh --outage and tests/load.sh

  # Applies clickhouse/init-users.sh (users, grants, Grafana's tenant row policy) each time this container starts. ClickHouse
  # runs that script by itself only on an empty volume; this brings an existing one up to date. The Collectors, the API and Grafana wait for
  # it, so starting any of them after an upgrade applies it. It then idles, healthy, because `docker compose up --wait` fails on a
  # container that exits even with 0; a failed script exits it, and --wait fails. A change to init-users.sh while it runs is
  # applied by scripts/apply-clickhouse-access.sh (a bind-mounted file changing doesn't recreate the container).
  # The marker is cleared first, so a restarted container isn't healthy until the script has run again; init: true lets it
  # stop at once instead of after Docker's 10 s grace period.
  clickhouse-access:
    image: *clickhouse-image
    entrypoint: ["bash", "-c", "rm -f /tmp/applied && bash /init-users.sh && touch /tmp/applied && exec sleep infinity"]
    init: true
    environment:
      <<: *clickhouse-access-env
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./clickhouse/init-users.sh:/init-users.sh:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/applied"]
      interval: 2s
      timeout: 2s
      retries: 30
      # Longer than init-users.sh waits for ClickHouse on the network (120 s): failures in this period don't count, and the
      # container turns healthy as soon as the script is done.
      start_period: 150s
    restart: "no"

  # Adds the resource attributes the platform reads as columns of their own on the Collector's tables (clickhouse/resource-columns.sh,
  # Phase 11 R12), each time this container starts. The exporter creates its tables when the Collector starts, so this waits for the
  # Collector, then for the tables. The platform API and Grafana read the columns, so they wait for it. It idles healthy afterwards,
  # like clickhouse-access; scripts/apply-clickhouse-access.sh runs the script again by hand.
  clickhouse-columns:
    image: *clickhouse-image
    entrypoint: ["bash", "-c", "rm -f /tmp/applied && bash /resource-columns.sh && touch /tmp/applied && exec sleep infinity"]
    init: true
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?run scripts/init.sh}
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./clickhouse/resource-columns.sh:/resource-columns.sh:ro
    depends_on:
      clickhouse-access:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/applied"]
      interval: 2s
      timeout: 2s
      retries: 30
      # Longer than the script waits for the tables (180 s).
      start_period: 200s
    restart: "no"

  # Optional (UI architecture §5): only with --profile grafana. Juice Console is the product UI.
  grafana:
    image: grafana/grafana:13.2.5
    profiles: [grafana]
    environment:
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}:3000
      # Local admin account: API and break-glass use only (basic auth). People sign in through Keycloak.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # OIDC login (Keycloak realm juice, client grafana). The browser uses PUBLIC_HOST:8080; Grafana's own calls use
      # the keycloak service name. Roles come from the grafana client roles in the "roles" claim; a user with none of
      # them is refused (strict), and no OIDC user becomes Grafana server admin.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?run scripts/init.sh}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://${PUBLIC_HOST:-localhost}:8080/realms/juice/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/juice/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/juice/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || contains(roles[*], 'viewer') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://${PUBLIC_HOST:-localhost}:8080/realms/juice/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2F${PUBLIC_HOST:-localhost}%3A3000%2Flogin
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.1
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
      JUICE_PLATFORM_TENANT_ID: ${JUICE_PLATFORM_TENANT_ID}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-access:
        condition: service_healthy
      # Grafana's row policy reads the tenant column (clickhouse/resource-columns.sh).
      clickhouse-columns:
        condition: service_healthy
    # Keycloak is the shared one (dev-infra), reached as keycloak:8080 on the juice-dev network.
    networks: [default, juice-dev]

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: juice_observability
      POSTGRES_USER: juice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juice -d juice_observability"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The platform API and its workers (discovery, health, rules, webhooks), built from this repository.
  # Started with: docker compose --profile platform up -d --wait   (the default profile is the telemetry stack alone)
  platform-api:
    profiles: ["platform"]
    build:
      context: ../..
      # The Juice.Notifications alphas come from GitHub Packages: the credentials nuget.config names, from the environment (secrets below).
      secrets: [github_package_username, github_package_token]
    # The host user that owns secrets/agents (scripts/init.sh writes JUICE_UID), so keys readable by their owner only can be read here.
    user: "${JUICE_UID:-1654}"
    # A crashed API is started again: without it every worker stays down until someone notices (docs/scale-tests.md, the workers ceiling).
    restart: unless-stopped
    environment:
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=juice_observability;Username=juice;Password=${POSTGRES_PASSWORD}
      ClickHouse__ConnectionString: Host=clickhouse;Port=8123;Username=platform_reader;Password=${CLICKHOUSE_PLATFORM_PASSWORD};Database=otel
      # The platform's own metrics (Phase 11, docs/platform-metrics.md): ClickHouse sampled through platform_monitor, and everything
      # exported to the Collector's platform pipeline, under the reserved tenant juice-platform.
      ClickHouse__MonitorConnectionString: Host=clickhouse;Port=8123;Username=platform_monitor;Password=${CLICKHOUSE_MONITOR_PASSWORD}
      Telemetry__Otlp__Endpoint: https://otel-collector:4319
      Telemetry__Otlp__TokenFile: /secrets/platform-otlp-token
      Telemetry__Otlp__CaFile: /secrets/ca.crt
      # The Collector's health check, for the platform's status (/health/platform, /api/v1/platform/status).
      Telemetry__CollectorHealthUrl: http://otel-collector:13133/
      # The Collector's own metrics, for the Overview's ingestion figures (Phase 11 R8), and the capacity view's calibration (R9: the
      # scale steps on the reference host, scale/calibration.mjs).
      Telemetry__CollectorMetricsUrl: http://otel-collector:8888/metrics
      Capacity__CalibrationFile: /config/capacity/calibration.json
      Platform__TenantKey: ${JUICE_PLATFORM_TENANT_ID}
      # Set while the deployment moves from its old tenant name to its Id (scripts/rekey-tenant.sh); empty otherwise.
      Platform__PreviousTenantKey: ${JUICE_PLATFORM_PREVIOUS_TENANT_ID:-}
      # Metadata and keys over the compose network; the issuer stays http://PUBLIC_HOST:8080/realms/juice (KC_HOSTNAME).
      Auth__Authority: http://keycloak:8080/realms/juice
      Auth__RequireHttpsMetadata: "false"
      Database__Migrate: "true"
      Rules__File: /config/rules.json
      Webhooks__File: /config/webhooks.json
      Slos__File: /config/slos.json
      # A new SLO counts its 30 days in a few passes here; production counts 12 hours a pass.
      Slos__MaxMinutesPerPass: "10080"
      Integrations__Grafana__BaseUrl: http://${PUBLIC_HOST:-localhost}:3000
      # Juice Agent: the agent listener on 8443 (mTLS), with the keys scripts/init.sh writes.
      Agents__Enabled: "true"
      Agents__CaCertificateFile: /secrets/agents/ca.crt
      Agents__CaKeyFile: /secrets/agents/ca.key
      Agents__CommandKeyFile: /secrets/agents/command.key
      Agents__ServerCertificateFile: /secrets/agents/listener.crt
      Agents__ServerKeyFile: /secrets/agents/listener.key
      # agent.update: packages dropped into ./packages are offered once release.pub verifies their signature (console/e2e/agent-update.mjs).
      Agents__PackageDirectory: /packages
      Agents__ReleaseKeyFiles__0: /secrets/release.pub
    volumes:
      - ./rules.json:/config/rules.json:ro
      - ./webhooks.json:/config/webhooks.json:ro
      - ./slos.json:/config/slos.json:ro
      - ./capacity:/config/capacity:ro
      - ./secrets/agents:/secrets/agents:ro
      - ./secrets/release/release.pub:/secrets/release.pub:ro
      - ./secrets/platform-otlp-token:/secrets/platform-otlp-token:ro
      - ./secrets/tls/ca.crt:/secrets/ca.crt:ro
      - ./packages:/packages:ro
    configs:
      - source: console-config
        target: /app/wwwroot/config.json
    ports:
      - "5180:8080"
      - "5181:8443"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # Its users, grants and row policies applied (and so after an upgrade, by starting the API alone).
      clickhouse-access:
        condition: service_healthy
      # Its queries read the resource columns (clickhouse/resource-columns.sh).
      clickhouse-columns:
        condition: service_healthy
    # Keycloak is the shared one (dev-infra), reached as keycloak:8080 on the juice-dev network.
    networks: [default, juice-dev]

  # A Juice Agent on this machine, to try Phase 7. console/e2e/agent.mjs creates its enrollment token and starts it:
  #   docker compose --profile platform --profile agent up -d agent
  agent:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: Dockerfile.agent
    # The host's name, as the Collector names it in host metrics: the platform links the agent to the host it discovered by that name.
    hostname: ${JUICE_HOST_NAME:-local-docker-host}
    # Under its launcher, so agent.update can be tried here: the image's agent is installed into /data/home once, and updates and rollbacks
    # happen there. The image alone runs the agent without the launcher, and a new image is how a container is normally updated.
    entrypoint: ["dotnet", "/launcher/juice-agent-launcher.dll", "--home", "/data/home", "--seed", "/app"]
    # The launcher exits when the agent does (other than to update): restarted, as a service manager would.
    restart: unless-stopped
    environment:
      JUICE_AGENT_CONFIG: /config/agent.json
      Agent__PlatformUrl: https://platform-api:8443
      Agent__PlatformCaFile: /secrets/ca.crt
      Agent__DataDirectory: /data
      Agent__EnrollmentTokenFile: /secrets/enrollment-token
      Agent__HostRoot: /hostfs
      Agent__ReleaseKeyFiles__0: /secrets/release.pub
    volumes:
      - ./agent.json:/config/agent.json:ro
      - ./secrets/tls/ca.crt:/secrets/ca.crt:ro
      - ./secrets/agent-enrollment-token:/secrets/enrollment-token:ro
      - ./secrets/release/release.pub:/secrets/release.pub:ro
      - agent-data:/data
      - /:/hostfs:ro
    depends_on:
      platform-api:
        condition: service_healthy

networks:
  # The shared dev infrastructure's network (../../../dev-infra: docker compose up -d there first), for its Keycloak.
  juice-dev:
    external: true

# The GitHub Packages credentials for the API's image build (GITHUB_PACKAGE_USERNAME and GITHUB_PACKAGE_TOKEN in the environment).
secrets:
  github_package_username:
    environment: GITHUB_PACKAGE_USERNAME
  github_package_token:
    environment: GITHUB_PACKAGE_TOKEN

volumes:
  agent-data:
  clickhouse-data:
  grafana-data:
  postgres-data:

configs:
  # Juice Console sign-in, replacing the image's wwwroot/config.json: the issuer must be Keycloak's public address.
  # Local stack only: Keycloak is plain HTTP, also when reached by a machine address (requireHttps false).
  console-config:
    content: |
      {"apiBase": "", "auth": {"issuer": "http://${PUBLIC_HOST:-localhost}:8080/realms/juice", "clientId": "juice-console", "scope": "openid profile email", "requireHttps": false}}
